<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MSG Oilfield Equipment Trading LLC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-grid {
            background-image: radial-gradient(rgba(30, 58, 138, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 bg-grid">

    <div class="max-w-md w-full bg-white text-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700/30">
        
        <!-- Top Branded Header Bar -->
        <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-8 text-center border-b border-slate-800 relative">
            <div class="flex justify-center mb-3">
                <img src="https://www.msgoilfield.com/logo.png" 
                     onerror="this.onerror=null; this.src='/static/logo.png';" 
                     alt="MSG Oilfield Equipment Trading LLC" 
                     class="h-14 object-contain filter drop-shadow-md">
            </div>
            <h1 class="text-lg font-bold text-white tracking-wide mt-2">LETTER OF COMPLIANCE GENERATOR</h1>
            <p class="text-xs text-slate-400 mt-1">MSG Oilfield Equipment Trading LLC</p>
        </div>

        <!-- Login Card Body -->
        <div class="p-6 sm:p-8 space-y-6">

            <!-- Auto-Generated Password Notice Box -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-start space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center flex-shrink-0 text-sm font-bold mt-0.5">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div class="flex-1 text-xs">
                    <p class="font-bold text-blue-950">Auto-Generated Credentials</p>
                    <p class="text-blue-800 mt-0.5">Email: <span class="font-bold text-blue-950">{{ email }}</span></p>
                    <p class="text-blue-800">Password: <span class="font-bold bg-blue-100 text-blue-950 px-2 py-0.5 rounded border border-blue-300 font-mono text-[11px]">{{ password }}</span></p>
                    <button onclick="fillDemoCredentials()" class="mt-2 text-xs text-blue-700 hover:text-blue-900 font-bold underline flex items-center space-x-1">
                        <i class="fa-solid fa-bolt text-amber-500"></i>
                        <span>1-Click Auto Fill Credentials</span>
                    </button>
                </div>
            </div>

            <!-- Error Alert -->
            <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                <span id="login-error-msg">Invalid email or password.</span>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope text-xs"></i>
                        </div>
                        <input type="email" id="email" required 
                               value="{{ email }}"
                               class="w-full text-xs pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none" 
                               placeholder="info@msgoilfield.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </div>
                        <input type="password" id="password" required 
                               value="{{ password }}"
                               class="w-full text-xs pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none" 
                               placeholder="Enter password">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Sign In to LOC Generator</span>
                </button>
            </form>

        </div>

        <!-- Footer Notice -->
        <div class="bg-slate-50 border-t border-slate-100 p-4 text-center text-[11px] text-slate-400">
            &copy; 2026 MSG Oilfield Equipment Trading LLC. All rights reserved.
        </div>
    </div>

    <script>
        const demoEmail = "{{ email }}";
        const demoPassword = "{{ password }}";

        function fillDemoCredentials() {
            document.getElementById('email').value = demoEmail;
            document.getElementById('password').value = demoPassword;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            errorDiv.classList.add('hidden');

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    document.getElementById('login-error-msg').innerText = data.error || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                }
            })
            .catch(err => {
                document.getElementById('login-error-msg').innerText = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
